<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BeeCode · Вариант 1 — Neon Glass</title>
<style>
  :root {
    --accent: #4d6bfe;
    --accent-soft: #4d6bfe22;
    --bg: #05050a;
    --bg2: #0a0a14;
    --card: rgba(255,255,255,0.045);
    --card2: rgba(255,255,255,0.07);
    --line: rgba(255,255,255,0.09);
    --ink: #eef0ff;
    --muted: #9aa0c3;
    --faint: #5c6285;
    --good: #3ddc84;
    --radius: 18px;
    --font: "Inter","Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
  body::before { content:""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 50% at 20% 0%, var(--accent-soft), transparent 60%),
      radial-gradient(50% 40% at 90% 100%, rgba(212,240,0,0.05), transparent 60%),
      radial-gradient(40% 40% at 70% 10%, rgba(0,212,255,0.05), transparent 60%); }
  #app { position: relative; z-index: 1; display: flex; height: 100vh; }

  .sidebar { width: 252px; min-width: 252px; background: var(--bg2);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    padding: 14px 12px; gap: 4px; backdrop-filter: blur(20px); }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 12px; }
  .mark { width: 26px; height: 26px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent) 40%, #7b5cff);
    box-shadow: 0 0 18px var(--accent-soft), 0 0 0 1px var(--accent) inset;
    color: #fff; font-weight: 800; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; }
  .word { font-weight: 700; font-size: 15.5px; letter-spacing: -0.01em; }
  .ver { color: var(--faint); font-size: 11px; margin-left: auto; }

  .new-chat { display: flex; align-items: center; gap: 8px; background: var(--card2);
    color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, box-shadow .2s; }
  .new-chat:hover { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-soft); }

  .search-row { display: flex; align-items: center; gap: 7px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 10px; margin: 10px 0 4px; }
  .search-row input { background: none; border: none; outline: none; color: var(--ink);
    font-family: inherit; font-size: 13px; width: 100%; }
  .search-row input::placeholder { color: var(--faint); }
  .side-label { color: var(--faint); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; padding: 10px 6px 4px; }
  .sessions { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .session { padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent;
    transition: background .2s, border-color .2s; }
  .session b { display: block; font-size: 13px; font-weight: 600; }
  .session small { color: var(--faint); font-size: 11px; }
  .session:hover { background: var(--card); }
  .session.on { background: var(--accent-soft); border-color: var(--accent); }

  .side-bottom { margin-top: 8px; }
  .project { color: var(--faint); font-size: 11px; padding: 4px 8px 8px; }
  .me { display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .avatar { width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7b5cff); color: #fff;
    font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .whoami { font-size: 13px; font-weight: 600; margin-right: auto; }
  .iconbtn { background: none; border: none; color: var(--muted); cursor: pointer;
    width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; transition: background .2s, color .2s; }
  .iconbtn:hover { background: var(--card2); color: var(--ink); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .greet { padding: 40px 40px 8px; }
  .greet h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin: 0;
    background: linear-gradient(120deg, var(--ink), var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .greet .hint { color: var(--muted); margin-top: 8px; font-size: 14px; }

  .chat { flex: 1; overflow-y: auto; padding: 10px 40px 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 640px; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 14px; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent) 55%, #7b5cff);
    color: #fff; box-shadow: 0 6px 24px var(--accent-soft); }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--line);
    border-radius: 16px 16px 16px 4px; }
  .bubble code { background: var(--bg2); padding: 1px 6px; border-radius: 6px;
    font-family: Consolas, monospace; font-size: 12.5px; }

  .composer-wrap { padding: 6px 40px 18px; }
  .chips { display: flex; gap: 8px; margin-bottom: 8px; }
  .chip { background: var(--card); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; }
  .composer { position: relative; background: var(--card2);
    border: 1px solid var(--line); border-radius: 20px; padding: 10px 12px 10px 14px;
    backdrop-filter: blur(24px); transition: border-color .25s, box-shadow .25s; }
  .composer:focus-within { border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 8px 40px var(--accent-soft); }
  .input { width: 100%; border: none; outline: none; resize: none; background: none;
    color: var(--ink); font-family: inherit; font-size: 14.5px; min-height: 24px;
    max-height: 160px; }
  .input::placeholder { color: var(--faint); }
  .composer-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .left { display: flex; align-items: center; gap: 6px; }
  .attach { border: 1px solid var(--line); border-radius: 10px; width: 30px; height: 30px; }
  .modelpill { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink); padding: 5px 11px;
    font-size: 13px; cursor: pointer; transition: border-color .2s; }
  .modelpill:hover { border-color: var(--accent); }
  .mico { width: 18px; height: 18px; display: inline-flex; }
  .mico img { width: 100%; height: 100%; border-radius: 5px; }
  .modelname { font-weight: 600; }
  .chev { color: var(--faint); font-size: 10px; }
  .permmode { border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--muted); padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .send { width: 34px; height: 34px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #7b5cff); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px var(--accent-soft); transition: transform .15s, box-shadow .2s; }
  .send:hover { transform: translateY(-1px); box-shadow: 0 10px 26px var(--accent-soft); }

  .modelmenu { position: absolute; bottom: calc(100% + 8px); left: 44px; width: 300px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); z-index: 20; }
  .modelmenu.hidden { display: none; }
  .mi { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
    border-bottom: 1px solid var(--line); }
  .mi:last-child { border-bottom: none; }
  .mi:hover { background: var(--card); }
  .mi.on { background: var(--accent-soft); }
  .mi img { width: 22px; height: 22px; border-radius: 6px; }
  .mi-name { font-weight: 600; font-size: 13.5px; }
  .mi small { margin-left: auto; color: var(--faint); font-size: 11px; font-family: Consolas, monospace; }

  .ctxbar { height: 6px; background: var(--card); border-radius: 999px; margin-top: 8px; overflow: hidden; }
  .ctxfill { height: 100%; width: 38%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #7b5cff); }

  .comet { position: fixed; top: 18%; width: 220px; height: 2px; border-radius: 2px; z-index: 5;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    filter: drop-shadow(0 0 8px var(--accent)); pointer-events: none; }
</style>
</head>
<body>
<script src="../vendor/anime.min.js"></script>
<script src="_demo.js"></script>
</body>
</html>

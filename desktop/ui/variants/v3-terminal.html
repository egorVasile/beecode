<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BeeCode · Вариант 3 — Terminal CRT</title>
<style>
  :root {
    --accent: #33ff66;
    --accent-soft: #33ff6614;
    --bg: #040604;
    --bg2: #070b07;
    --card: #0a100a;
    --card2: #0d140d;
    --line: #1c2a1c;
    --line2: #274027;
    --ink: #c9ffcf;
    --muted: #63a06e;
    --faint: #33503a;
    --good: #33ff66;
    --radius: 0px;
    --font: "Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 13.5px; overflow: hidden; }
  body::after { content:""; position: fixed; inset: 0; z-index: 99; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); }
  body::before { content:""; position: fixed; inset: 0; z-index: 98; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,0.55)); }
  #app { position: relative; z-index: 1; display: flex; height: 100vh; }

  .sidebar { width: 252px; min-width: 252px; background: var(--bg2);
    border-right: 2px solid var(--line2); display: flex; flex-direction: column;
    padding: 14px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 12px; }
  .mark { width: 26px; height: 26px; border: 2px solid var(--accent); color: var(--accent);
    font-weight: 800; font-size: 15px; text-shadow: 0 0 8px var(--accent);
    display: inline-flex; align-items: center; justify-content: center; }
  .word { font-weight: 700; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
  .word::after { content: "_"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .ver { color: var(--faint); font-size: 11px; margin-left: auto; }

  .new-chat { display: flex; align-items: center; gap: 8px; background: var(--bg);
    color: var(--accent); border: 2px solid var(--line2); padding: 8px 11px;
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; transition: background .15s, color .15s; }
  .new-chat:hover { background: var(--accent); color: var(--bg); }

  .search-row { display: flex; align-items: center; gap: 7px; color: var(--muted);
    border: 1px solid var(--line); padding: 7px 10px; margin: 10px 0 4px; }
  .search-row input { background: none; border: none; outline: none; color: var(--ink);
    font-family: inherit; font-size: 13px; width: 100%; }
  .search-row input::placeholder { color: var(--faint); }
  .side-label { color: var(--faint); font-size: 11px; font-weight: 700;
    letter-spacing: .12em; padding: 10px 6px 4px; }
  .sessions { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .session { padding: 8px 10px; cursor: pointer; border-left: 3px solid transparent; }
  .session b { display: block; font-size: 13px; font-weight: 400; }
  .session small { color: var(--faint); font-size: 11px; }
  .session:hover { background: var(--card); }
  .session.on { border-left-color: var(--accent); background: var(--accent-soft);
    color: var(--accent); }

  .side-bottom { margin-top: 8px; }
  .project { color: var(--faint); font-size: 11px; padding: 4px 8px 8px; }
  .me { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line);
    padding: 8px 10px; }
  .avatar { width: 24px; height: 24px; border: 1px solid var(--accent); color: var(--accent);
    font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .whoami { font-size: 13px; margin-right: auto; }
  .iconbtn { background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer;
    width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; }
  .iconbtn:hover { border-color: var(--accent); color: var(--accent); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .greet { padding: 40px 40px 8px; }
  .greet h1 { font-size: 30px; font-weight: 400; letter-spacing: 0.02em; margin: 0; color: var(--accent);
    text-shadow: 0 0 12px var(--accent-soft); }
  .greet h1::before { content: "$ "; }
  .greet .hint { color: var(--muted); margin-top: 8px; font-size: 13px; }

  .chat { flex: 1; overflow-y: auto; padding: 10px 40px 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 640px; padding: 11px 15px; line-height: 1.65; font-size: 13.5px; }
  .msg.user .bubble { border: 1px solid var(--line2); border-left: 3px solid var(--accent); }
  .msg.assistant .bubble { border: 1px solid var(--line); }
  .bubble code { background: var(--bg2); padding: 0 5px; border: 1px solid var(--line); }

  .composer-wrap { padding: 6px 40px 18px; }
  .chips { display: flex; gap: 8px; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); color: var(--muted); padding: 3px 11px; font-size: 12px; }
  .composer { position: relative; background: var(--bg2);
    border: 1px solid var(--line2); padding: 10px 12px 10px 14px;
    transition: border-color .2s, box-shadow .2s; }
  .composer:focus-within { border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 18px var(--accent-soft); }
  .input { width: 100%; border: none; outline: none; resize: none; background: none;
    color: var(--ink); font-family: inherit; font-size: 14px; min-height: 24px; max-height: 160px; }
  .input::placeholder { color: var(--faint); }
  .composer-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .left { display: flex; align-items: center; gap: 6px; }
  .attach { border: 1px solid var(--line); width: 30px; height: 30px; }
  .modelpill { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line2);
    background: var(--bg); color: var(--ink); padding: 5px 11px; font-size: 13px; cursor: pointer;
    transition: border-color .2s; }
  .modelpill:hover { border-color: var(--accent); }
  .mico { width: 18px; height: 18px; display: inline-flex; }
  .mico img { width: 100%; height: 100%; }
  .modelname { font-weight: 700; }
  .chev { color: var(--faint); font-size: 10px; }
  .permmode { border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .send { width: 34px; height: 34px; border: 2px solid var(--accent); background: none;
    color: var(--accent); cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; transition: background .15s, color .15s; }
  .send:hover { background: var(--accent); color: var(--bg); }

  .modelmenu { position: absolute; bottom: calc(100% + 8px); left: 44px; width: 300px;
    background: var(--bg2); border: 1px solid var(--line2); box-shadow: 0 0 0 1px var(--bg), 0 20px 60px rgba(0,0,0,.6);
    z-index: 20; }
  .modelmenu.hidden { display: none; }
  .mi { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
    border-bottom: 1px solid var(--line); }
  .mi:last-child { border-bottom: none; }
  .mi:hover { background: var(--card); }
  .mi.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .mi img { width: 22px; height: 22px; }
  .mi-name { font-weight: 700; font-size: 13px; }
  .mi small { margin-left: auto; color: var(--faint); font-size: 11px; }

  .ctxbar { height: 8px; border: 1px solid var(--line); margin-top: 9px; padding: 1px; }
  .ctxfill { height: 100%; width: 38%; background: var(--accent); }

  .comet { position: fixed; top: 14%; width: 200px; height: 2px; z-index: 5;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 8px var(--accent); pointer-events: none; }
</style>
</head>
<body>
<script src="../vendor/anime.min.js"></script>
<script src="_demo.js"></script>
</body>
</html>

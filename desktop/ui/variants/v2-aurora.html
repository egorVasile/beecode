<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BeeCode · Вариант 2 — Aurora Paper</title>
<style>
  :root {
    --accent: #7c6ff0;
    --accent-soft: #7c6ff026;
    --bg: #f7f5ff;
    --bg2: #ffffff;
    --card: #ffffff;
    --card2: #ffffff;
    --line: #ece8fa;
    --line2: #dcd6f5;
    --ink: #26223a;
    --muted: #6f6a8c;
    --faint: #a7a1c4;
    --good: #2bb673;
    --radius: 22px;
    --font: "Inter","Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
  body::before { content:""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(45% 40% at 12% 8%, #ffd9ec55, transparent 60%),
      radial-gradient(50% 45% at 92% 12%, #c9e4ff66, transparent 60%),
      radial-gradient(55% 50% at 70% 96%, #e6dcff66, transparent 60%),
      radial-gradient(40% 40% at 20% 95%, #d3f4e366, transparent 60%); }
  #app { position: relative; z-index: 1; display: flex; height: 100vh; }

  .sidebar { width: 252px; min-width: 252px; background: rgba(255,255,255,0.72);
    border-right: 1px solid var(--line); backdrop-filter: blur(20px);
    display: flex; flex-direction: column; padding: 14px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 12px; }
  .mark { width: 28px; height: 28px; border-radius: 12px;
    background: linear-gradient(135deg, #b39cff, var(--accent));
    color: #fff; font-weight: 800; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px var(--accent-soft); }
  .word { font-weight: 800; font-size: 15.5px; letter-spacing: -0.02em; }
  .ver { color: var(--faint); font-size: 11px; margin-left: auto; }

  .new-chat { display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent), #a58cff); color: #fff;
    border: none; border-radius: 14px; padding: 10px 12px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 22px var(--accent-soft); transition: transform .18s, box-shadow .25s; }
  .new-chat:hover { transform: translateY(-2px); box-shadow: 0 12px 28px var(--accent-soft); }

  .search-row { display: flex; align-items: center; gap: 7px; color: var(--muted);
    background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 11px; margin: 10px 0 4px; box-shadow: 0 2px 8px rgba(124,111,240,0.06); }
  .search-row input { background: none; border: none; outline: none; color: var(--ink);
    font-family: inherit; font-size: 13px; width: 100%; }
  .search-row input::placeholder { color: var(--faint); }
  .side-label { color: var(--faint); font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .08em; padding: 12px 6px 6px; }
  .sessions { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .session { padding: 10px 12px; border-radius: 13px; cursor: pointer;
    border: 1px solid transparent; transition: background .2s, border-color .2s, transform .15s; }
  .session b { display: block; font-size: 13px; font-weight: 700; }
  .session small { color: var(--faint); font-size: 11px; }
  .session:hover { background: var(--bg2); transform: translateX(2px); }
  .session.on { background: var(--accent-soft); border-color: var(--accent);
    box-shadow: 0 4px 14px var(--accent-soft); }

  .side-bottom { margin-top: 8px; }
  .project { color: var(--faint); font-size: 11px; padding: 4px 8px 8px; }
  .me { display: flex; align-items: center; gap: 8px; background: var(--bg2);
    border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px;
    box-shadow: 0 2px 10px rgba(124,111,240,0.06); }
  .avatar { width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #ffb4d9, var(--accent)); color: #fff;
    font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .whoami { font-size: 13px; font-weight: 700; margin-right: auto; }
  .iconbtn { background: none; border: none; color: var(--muted); cursor: pointer;
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9px; transition: background .2s, color .2s, transform .15s; }
  .iconbtn:hover { background: var(--accent-soft); color: var(--accent); transform: scale(1.1); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .greet { padding: 44px 44px 10px; }
  .greet h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin: 0;
    background: linear-gradient(120deg, var(--ink), var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .greet .hint { color: var(--muted); margin-top: 8px; font-size: 14px; }

  .chat { flex: 1; overflow-y: auto; padding: 10px 44px 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 640px; padding: 13px 17px; border-radius: 18px; line-height: 1.6; font-size: 14px; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), #a58cff);
    color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 8px 22px var(--accent-soft); }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--line);
    border-bottom-left-radius: 5px; box-shadow: 0 4px 16px rgba(124,111,240,0.08); }
  .bubble code { background: var(--bg); padding: 1px 6px; border-radius: 6px;
    font-family: Consolas, monospace; font-size: 12.5px; }

  .composer-wrap { padding: 6px 44px 20px; }
  .chips { display: flex; gap: 8px; margin-bottom: 8px; }
  .chip { background: var(--bg2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 5px 13px; font-size: 12px; box-shadow: 0 2px 6px rgba(124,111,240,0.05); }
  .composer { position: relative; background: var(--bg2);
    border: 1px solid var(--line2); border-radius: 22px; padding: 12px 14px 11px 16px;
    box-shadow: 0 10px 34px rgba(124,111,240,0.10); transition: border-color .25s, box-shadow .25s; }
  .composer:focus-within { border-color: var(--accent);
    box-shadow: 0 12px 40px var(--accent-soft); }
  .input { width: 100%; border: none; outline: none; resize: none; background: none;
    color: var(--ink); font-family: inherit; font-size: 14.5px; min-height: 24px; max-height: 160px; }
  .input::placeholder { color: var(--faint); }
  .composer-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .left { display: flex; align-items: center; gap: 7px; }
  .attach { border: 1px solid var(--line); border-radius: 11px; width: 31px; height: 31px; background: var(--bg2); }
  .modelpill { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg2); color: var(--ink); padding: 6px 12px;
    font-size: 13px; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .modelpill:hover { border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-soft); }
  .mico { width: 19px; height: 19px; display: inline-flex; }
  .mico img { width: 100%; height: 100%; border-radius: 6px; }
  .modelname { font-weight: 700; }
  .chev { color: var(--faint); font-size: 10px; }
  .permmode { border: 1px solid var(--line); border-radius: 11px; background: var(--bg2);
    color: var(--muted); padding: 6px 11px; font-size: 12px; cursor: pointer; }
  .send { width: 36px; height: 36px; border-radius: 13px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #a58cff); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px var(--accent-soft); transition: transform .18s, box-shadow .25s; }
  .send:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 12px 28px var(--accent-soft); }

  .modelmenu { position: absolute; bottom: calc(100% + 10px); left: 46px; width: 300px;
    background: var(--bg2); border: 1px solid var(--line2); border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(60,50,120,0.18); z-index: 20; }
  .modelmenu.hidden { display: none; }
  .mi { display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer;
    border-bottom: 1px solid var(--line); }
  .mi:last-child { border-bottom: none; }
  .mi:hover { background: var(--bg); }
  .mi.on { background: var(--accent-soft); }
  .mi img { width: 23px; height: 23px; border-radius: 7px; }
  .mi-name { font-weight: 700; font-size: 13.5px; }
  .mi small { margin-left: auto; color: var(--faint); font-size: 11px; font-family: Consolas, monospace; }

  .ctxbar { height: 7px; background: var(--line); border-radius: 999px; margin-top: 9px; overflow: hidden; }
  .ctxfill { height: 100%; width: 38%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #a58cff); }

  .comet { position: fixed; top: 16%; width: 200px; height: 3px; border-radius: 3px; z-index: 5;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    filter: blur(1px); pointer-events: none; }
</style>
</head>
<body>
<script src="../vendor/anime.min.js"></script>
<script src="_demo.js"></script>
</body>
</html>

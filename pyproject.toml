[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beeagent"
version = "0.2.0"
description = "BeeCode — a free AI coding agent for your terminal, powered by g4f (no API key)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "BeeCode contributors" }]
keywords = ["ai", "agent", "coding-assistant", "cli", "terminal", "g4f", "llm", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: Android",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "httpx>=0.25",
    "prompt_toolkit>=3.0",
    "textual>=0.60",
    # The two BeeCode asks for that are not pure Python: g4f drags in aiohttp,
    # brotli and pycryptodome, and tiktoken is Rust plus `regex`. PyPI publishes
    # no Android wheel for them and Termux ships no compiler, so on a phone they
    # are left out and the install goes through. What a phone gives up is the
    # keyless provider and the exact token count — /pool or /key <provider>
    # answers instead, and counting falls back to an over-estimate in
    # beeagent/utils/tokens.py, which is the safe direction. Both packages do
    # exist in TurboTermux (`pkg install tur-repo python-tiktoken`) for anyone
    # who wants them back.
    'g4f>=0.3.0; sys_platform != "android" and platform_system != "Android"',
    'tiktoken; sys_platform != "android" and platform_system != "Android"',
]

[project.urls]
Homepage = "https://github.com/egorVasile/beecode"
Repository = "https://github.com/egorVasile/beecode"
Issues = "https://github.com/egorVasile/beecode/issues"

[project.scripts]
beeagent = "beeagent.cli:main"
beecode = "beeagent.cli:main"

[tool.setuptools.packages.find]
include = ["beeagent*"]

[tool.setuptools.package-data]
# The extension catalog and its builtin templates ship inside the wheel.
"beeagent.plugins" = ["data/*.json", "templates/**/*"]

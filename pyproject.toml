[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beeagent"
version = "0.1.0"
description = "Free AI coding agent powered by g4f"
requires-python = ">=3.10"
dependencies = [
    "g4f>=0.3.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "tiktoken",
]

[project.scripts]
beeagent = "beeagent.cli:main"

[tool.setuptools.packages.find]
include = ["beeagent*"]
